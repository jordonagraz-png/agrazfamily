name: Tests

# Runs the security-rules tests (Firestore emulator) and the end-to-end UI tests
# (Playwright + a fake Firebase) on every push, so a change can't quietly break
# sign-in, privacy, or the Family Hub.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - name: Cache the Firestore emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Family tree engine tests
        run: npm run test:tree

      - name: Security rules tests
        run: npm run test:rules

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: UI tests
        run: npm run test:ui
        env:
          SLOW: 2
